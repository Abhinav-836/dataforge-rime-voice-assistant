name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test & Validate (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio requests

      - name: Secret Leak Prevention Guard
        shell: bash
        run: |
          echo "Scanning for accidental hardcoded API secrets..."
          # Reject commits containing real LiveKit, OpenAI, Deepgram, Groq, or Finnhub keys
          if grep -r -E "(API[a-zA-Z0-9]{16,}|dgr_[a-zA-Z0-9]{30,}|gsk_[a-zA-Z0-9]{40,}|sk-proj-[a-zA-Z0-9_-]{40,})" --exclude-dir={.git,.venv,venv,tests} --exclude={*.example,*.md} .; then
            echo "ERROR: Potential hardcoded secret detected in repository files!"
            exit 1
          fi
          echo "Secret check passed: No hardcoded secrets found in codebase."

      - name: Run Pytest Suite
        run: |
          pytest -v
