# render.yaml - Single Web Service (Free Tier Compatible)
# FIXED: Disabled agent's internal HTTP server

services:
  # Single Web Service - Runs HTTP Server + Voice Agent
  - type: web
    name: dataforge-rime-voice-assistant
    runtime: python
    repo: https://github.com/Abhinav-836/dataforge-rime-voice-assistant
    plan: free
    envVars:
      - key: PORT
        value: 5500
      - key: DATABASE_PATH
        value: /tmp/agent.db
      - key: RIME_API_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      # THIS IS THE KEY FIX - Disable agent's internal HTTP server
      - key: LIVEKIT_AGENT_PORT
        value: "0"
    buildCommand: |
      pip install -r requirements.txt
      python -c "from agent.db.database import init_db; init_db()"
      chmod +x start.sh
    startCommand: |
      ./start.sh
    healthCheckPath: /health